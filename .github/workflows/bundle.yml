name: Bundle

# Builds an installable npm tarball from a chosen branch and uploads it as a
# workflow artifact, so a change can be tried against a real site before it is
# released. It lives on this branch rather than on the change's own branch, so a
# pull request from that branch contains only the change.

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Branch or tag to build
        required: true
        default: fix/base-url-subdirectory
        type: string

permissions:
  contents: read

jobs:
  bundle:
    name: Package an installable tarball
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2

      - name: Derive a pnpm lockfile from package-lock.json
        run: pnpm import

      - name: Install
        run: pnpm install --frozen-lockfile --allow-build=esbuild --allow-build=workerd

      # Stamped before the build: VERSION is a source constant inlined by tsup, so
      # the bundle only reports this version if it is set first. The checkout keeps
      # the released version; only this workspace copy is bumped. The patch is
      # incremented so the build sorts above the release it derives from, which
      # stops the update check from nudging back to the unpatched release.
      - name: Stamp a build-local version
        run: |
          node -e '
            const fs = require("node:fs");
            const released = JSON.parse(fs.readFileSync("package.json", "utf8")).version.split("-")[0];
            const [major, minor, patch] = released.split(".").map(Number);
            const version = `${major}.${minor}.${patch + 1}-subdir.${process.env.GITHUB_RUN_NUMBER}`;

            const pkgPath = "package.json";
            const pkg = JSON.parse(fs.readFileSync(pkgPath, "utf8"));
            pkg.version = version;
            fs.writeFileSync(pkgPath, `${JSON.stringify(pkg, null, 2)}\n`);

            const versionPath = "src/version.ts";
            const source = fs.readFileSync(versionPath, "utf8");
            const stamped = source.replace(/^export const VERSION = "[^"]*";/mu, `export const VERSION = "${version}";`);
            if (stamped === source) throw new Error(`Could not stamp ${versionPath}`);
            fs.writeFileSync(versionPath, stamped);

            console.log(`building ${version}`);
          '

      - name: Build the bundles
        run: |
          pnpm exec tsc --noEmit
          pnpm exec tsup
          pnpm exec tsup --config tsup.worker.config.ts
          node scripts/check-shipped-vocabulary.mjs

      - name: Check the stamped version reached the bundle
        run: node dist/moodle.js --version

      - name: Pack
        run: pnpm pack

      - name: List the tarball
        run: ls -l ./*.tgz

      - uses: actions/upload-artifact@v4
        with:
          name: moodle-cli-tarball
          path: ./*.tgz
          if-no-files-found: error
          retention-days: 14
